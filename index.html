<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Warranty Job Photos</title>
<style>
  :root{
    --bg:#17181A;
    --surface:#212226;
    --surface-2:#2B2D31;
    --border:#3A3C41;
    --text:#F4F2EC;
    --text-dim:#A9A69D;
    --accent:#F5B300;
    --accent-text:#1A1300;
    --success:#2FA84F;
    --success-text:#06210D;
    --danger:#E5484D;
    --danger-text:#2B0705;
    --radius:14px;
    --tap:76px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;}
  #app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

  header{padding:16px 20px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;}
  header h1{font-size:18px;font-weight:700;margin:0;flex:1;letter-spacing:.2px;}
  #backBtn{width:52px;height:52px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:22px;display:none;align-items:center;justify-content:center;}
  #backBtn.show{display:flex;}
  #breadcrumb{font-size:13px;color:var(--text-dim);padding:0 20px 10px;border-bottom:1px solid var(--border);
    display:none;gap:14px;}
  #breadcrumb.show{display:flex;}
  #breadcrumb b{color:var(--text);}

  main{flex:1;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .screen{display:none;flex-direction:column;gap:14px;flex:1;}
  .screen.active{display:flex;}

  .step-label{font-size:14px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
  .big-title{font-size:24px;font-weight:700;margin:0 0 4px;}
  .sub{font-size:15px;color:var(--text-dim);margin:0;}

  button{font-family:inherit;cursor:pointer;}

  .btn{min-height:var(--tap);border-radius:var(--radius);border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:19px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 18px;
    transition:transform .06s ease, background .1s ease;}
  .btn:active{transform:scale(.97);background:var(--surface-2);}
  .btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-size:21px;}
  .btn-primary:active{background:#DBA200;}
  .btn-primary[disabled]{background:var(--surface-2);color:var(--text-dim);border-color:var(--border);opacity:.6;pointer-events:none;}
  .btn-success{background:var(--success);color:var(--success-text);border-color:var(--success);}
  .btn-danger{background:var(--surface);color:var(--danger);border-color:var(--danger);}
  .btn-list{display:flex;flex-direction:column;gap:12px;}

  .keypad-display{font-size:56px;font-weight:700;letter-spacing:8px;text-align:center;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 10px;font-variant-numeric:tabular-nums;min-height:110px;display:flex;align-items:center;justify-content:center;}
  .keypad-display .ph{color:var(--text-dim);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .keypad button{min-height:64px;font-size:26px;font-weight:700;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .keypad button:active{background:var(--surface-2);transform:scale(.96);}

  .reg-kb{display:flex;flex-direction:column;gap:10px;}
  .reg-kb-toprow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .reg-mode-btn,.reg-ctrl-btn{min-height:52px;font-size:15px;font-weight:700;}
  .reg-kb-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .reg-key{min-height:52px;border-radius:10px;font-size:18px;font-weight:700;
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    display:flex;align-items:center;justify-content:center;}
  .reg-key:active{background:var(--surface-2);transform:scale(.96);}

  input[type=text]{width:100%;min-height:var(--tap);font-size:26px;font-weight:700;text-align:center;
    letter-spacing:2px;text-transform:uppercase;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;}
  input[type=text]:focus{outline:2px solid var(--accent);}

  .folder-preview{font-size:14px;color:var(--text-dim);text-align:center;}
  .folder-preview code{color:var(--accent);font-size:15px;}

  .admin-note{background:#3A2E00;border:1px solid var(--accent);color:#F5D77A;
    border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.4;font-weight:600;
    margin:14px 20px 0;}
  .admin-note .admin-note-label{display:block;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;color:var(--accent);margin-bottom:4px;font-weight:800;}

  .capture-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .capture-btn{min-height:96px;flex-direction:column;font-size:16px;}
  #importBtn{min-height:60px;font-size:15px;}
  .capture-btn .icon{font-size:30px;line-height:1;}

  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
  .thumb{position:relative;border-radius:10px;overflow:hidden;background:var(--surface);
    border:1px solid var(--border);aspect-ratio:1/1;}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .kind{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;
    font-size:10px;padding:2px 6px;border-radius:6px;font-weight:700;}
  .thumb .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:8px;
    background:rgba(0,0,0,.65);color:#fff;border:none;font-size:16px;display:flex;align-items:center;justify-content:center;}

  .empty-hint{font-size:14px;color:var(--text-dim);text-align:center;padding:14px;border:1px dashed var(--border);border-radius:var(--radius);}

  .center-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  .center-msg .badge{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;}
  .badge-success{background:var(--success);color:var(--success-text);}

  .spacer{flex:1;}
  footer.actions{padding:16px 20px 22px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);}

  .thumb.video::after{content:"\25B6";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:20px;color:#fff;background:rgba(0,0,0,.5);width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;pointer-events:none;}

  #labelOverlay{position:fixed;inset:0;background:rgba(10,10,11,.92);z-index:100;
    display:none;flex-direction:column;padding:20px;overflow-y:auto;}
  #labelOverlay.show{display:flex;}
  .label-preview{width:100%;max-height:220px;border-radius:var(--radius);overflow:hidden;
    background:var(--surface);border:1px solid var(--border);margin-bottom:16px;flex-shrink:0;}
  .label-preview img,.label-preview video{width:100%;max-height:220px;object-fit:contain;display:block;}
  .label-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .label-btn{min-height:var(--tap);font-size:18px;}
  .label-other-box{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .discard-link{background:none;border:none;color:var(--danger);font-size:15px;font-weight:600;
    padding:14px;text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div id="app">

  <header>
    <button id="backBtn" onclick="goBack()">&#8592;</button>
    <h1 id="headerTitle">Warranty job photos</h1>
  </header>
  <div id="breadcrumb"></div>
  <div class="admin-note" id="adminNote" style="display:none;"></div>

  <main>

    <!-- STEP 1: mechanic -->
    <section class="screen" id="screen-1">
      <div class="step-label">Step 1 of 4</div>
      <h2 class="big-title">Who's this job for?</h2>
      <p class="sub">Tap your name to start</p>
      <div class="btn-list" id="mechanicList"></div>
    </section>

    <!-- STEP 2: WIP -->
    <section class="screen" id="screen-2">
      <div class="step-label">Step 2 of 4</div>
      <h2 class="big-title">Enter the WIP number</h2>
      <p class="sub">5 digits</p>
      <div class="keypad-display" id="wipDisplay"><span class="ph">-----</span></div>
      <div class="keypad" id="wipKeypad"></div>
    </section>

    <!-- STEP 3: reg -->
    <section class="screen" id="screen-3">
      <div class="step-label">Step 3 of 4</div>
      <h2 class="big-title">Enter the reg</h2>
      <div class="keypad-display" id="regDisplay"><span class="ph">Tap keys below</span></div>
      <div class="reg-kb">
        <div class="reg-kb-toprow">
          <button class="btn reg-mode-btn" id="regModeBtn" onclick="toggleRegMode()">ABC</button>
          <button class="btn reg-ctrl-btn" onclick="regBackspace()">&#9003;</button>
          <button class="btn reg-ctrl-btn" onclick="regClear()">Clear</button>
        </div>
        <div class="reg-kb-grid" id="regKbGrid"></div>
      </div>
      <div class="folder-preview" id="folderPreview"></div>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="regContinueBtn" disabled onclick="continueFromReg()">Continue</button>
    </section>

    <!-- STEP 4: capture -->
    <section class="screen" id="screen-4">
      <div class="step-label">Step 4 of 4</div>
      <h2 class="big-title">Add photos &amp; video</h2>
      <div class="capture-row">
        <button class="btn capture-btn" onclick="triggerCapture('photo')">
          <span class="icon">&#128247;</span> Take photo
        </button>
        <button class="btn capture-btn" onclick="triggerCapture('video')">
          <span class="icon">&#127909;</span> Record video
        </button>
      </div>
      <button class="btn" id="importBtn" onclick="triggerGalleryPick()">
        <span class="icon" style="font-size:20px;">&#128193;</span>&nbsp; Add from photos/files
      </button>
      <div id="captureEmptyHint" class="empty-hint">No files yet — take at least one photo or video to submit</div>
      <div class="thumbs" id="thumbs"></div>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="submitBtn" disabled onclick="startSubmit()">Send job</button>
    </section>

    <!-- STEP 6: done -->
    <section class="screen" id="screen-6">
      <div class="center-msg">
        <div class="badge badge-success">&#9993;</div>
        <h2 class="big-title" id="doneTitle">Almost done</h2>
        <p class="sub" id="doneSub"></p>
      </div>
    </section>

  </main>

  <footer class="actions" id="footerActions"></footer>

</div>

<!-- TEST: swapped to "user" to check for a known Android Chrome bug where
     environment/user get mapped backwards on certain versions. If this opens
     the REAR camera correctly, leave it as "user" — it's intentional, not a typo. -->
<input type="file" id="photoInput" accept="image/*" capture="user" style="display:none">
<input type="file" id="videoInput" accept="video/*" capture="user" style="display:none">
<input type="file" id="galleryInput" accept="image/*,video/*" multiple style="display:none">

<div id="labelOverlay">
  <h2 class="big-title">What's this of?</h2>
  <div class="label-preview" id="labelPreview"></div>
  <div class="label-grid" id="labelGrid"></div>
  <div class="label-other-box" id="labelOtherBox" style="display:none;">
    <input type="text" id="labelOtherInput" placeholder="Type what it's of" maxlength="30">
    <button class="btn btn-primary" onclick="confirmOtherLabel()">Use this name</button>
  </div>
  <button class="discard-link" onclick="discardPending()">Discard this photo/video</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   FIREBASE — same project/config as admin.html. This is what lets
   the app check for an admin note the moment a WIP is entered.
   Safe to be visible in the page source — access control is
   enforced by Firestore's security rules, not by hiding this.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBcpFoOaSmP1kx_fSbvXGeCdkzCTGSdvso",
  authDomain: "warrantyapp-fb676.firebaseapp.com",
  projectId: "warrantyapp-fb676",
  storageBucket: "warrantyapp-fb676.firebasestorage.app",
  messagingSenderId: "1031213749394",
  appId: "1:1031213749394:web:cb5b7a818bb1507703c24b"
};

let db = null;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
} catch(err){
  console.error("Firebase init failed", err);
}

/* ============================================================
   CONFIG — edit before deploying
   ============================================================ */
const CONFIG = {
  // Every address the job should go to. The FIRST one must be the inbox your
  // Power Automate flow watches — that's the one the folder-filing logic
  // depends on. Any others (e.g. a manager) just get a copy for visibility.
  // The mechanic still has to enter these in their Mail app — browsers can't
  // pre-fill the "To"/"Cc" fields on a shared email — so save these as
  // contacts on each phone so they autocomplete after a couple of letters.
  warrantyEmails: [
    "servicelimerick@hinchys.ie",
    "ekennedy@hinchys.ie"
  ],

  // Replace with your mechanics' names. This is a placeholder list.
  mechanics: [
    "Adrian",
    "Eamonn",
    "Jack",
    "Kieran",
    "Renier",
    "Sergiu"
  ],


  // Quick-pick labels shown after every photo/video capture.
  // Attachment filenames are "<REG>_<WIP> <label>.<ext>" e.g. "231D12345_12345 VIN.jpg" —
  // the flow strips the "<REG>_" prefix off before saving, so the file that ends up
  // in SharePoint is just "<WIP> <label>.jpg". The reg prefix only exists so the
  // flow can tell which folder to file it into without trusting the email subject.
  // limit: 1 means only one of these is kept per job — capturing another
  //        replaces the previous one. limit: 0 means unlimited.
  // "Other" always appears last, is unlimited, and lets the mechanic type a custom label.
  labels: [
    { name: "VIN", limit: 1 },
    { name: "Mileage", limit: 1 },
    { name: "Fault", limit: 0 },
    { name: "LOT", limit: 0 }
  ]
};

/* ============================================================
   STATE
   ============================================================ */
let state = {
  step: 1,
  mechanic: null,
  wip: "",
  reg: "",
  jobId: null,
  captures: [] // {id, kind, blob, previewUrl, filename, label}
};

function vibrate(ms){ if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} } }

/* ============================================================
   NAVIGATION
   ============================================================ */
function goToStep(n){
  state.step = n;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + n).classList.add("active");

  const titles = {
    1: "Warranty job photos", 2: "Enter WIP number", 3: "Enter reg",
    4: "Add photos & video", 6: "Almost done"
  };
  document.getElementById("headerTitle").textContent = titles[n] || "Warranty job photos";
  document.getElementById("backBtn").classList.toggle("show", n >= 2 && n <= 4);
  renderBreadcrumb();
  renderFooter();
}

function goBack(){
  if (state.step === 2) goToStep(1);
  else if (state.step === 3) goToStep(2);
  else if (state.step === 4) goToStep(3);
}

function renderBreadcrumb(){
  const el = document.getElementById("breadcrumb");
  const parts = [];
  if (state.mechanic) parts.push("<b>" + escapeHtml(state.mechanic) + "</b>");
  if (state.wip) parts.push("WIP <b>" + escapeHtml(state.wip) + "</b>");
  if (state.reg) parts.push("Reg <b>" + escapeHtml(state.reg) + "</b>");
  if (parts.length && state.step >= 2 && state.step <= 6){
    el.innerHTML = parts.join(" &middot; ");
    el.classList.add("show");
  } else {
    el.classList.remove("show");
  }
}

function renderFooter(){
  const footer = document.getElementById("footerActions");
  footer.innerHTML = "";
  if (state.step === 6){
    const sameBtn = mkBtn("Start next job (same mechanic)", "btn btn-primary", () => resetForNewJob(true));
    const diffBtn = mkBtn("Different mechanic", "btn", () => resetForNewJob(false));
    footer.appendChild(sameBtn);
    footer.appendChild(diffBtn);
  }
}

function mkBtn(label, cls, onClick){
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   STEP 1 — mechanic
   ============================================================ */
function renderMechanics(){
  const list = document.getElementById("mechanicList");
  list.innerHTML = "";
  CONFIG.mechanics.forEach(name => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = name;
    b.onclick = () => selectMechanic(name);
    list.appendChild(b);
  });
}

function selectMechanic(name){
  vibrate(30);
  state.mechanic = name;
  goToStep(2);
}

/* ============================================================
   STEP 2 — WIP keypad
   ============================================================ */
function renderWipKeypad(){
  const pad = document.getElementById("wipKeypad");
  pad.innerHTML = "";
  const keys = ["1","2","3","4","5","6","7","8","9","clear","0","back"];
  keys.forEach(k => {
    const b = document.createElement("button");
    if (k === "clear"){ b.textContent = "Clear"; b.style.fontSize = "16px"; b.onclick = () => { state.wip=""; updateWipDisplay(); }; }
    else if (k === "back"){ b.innerHTML = "&#9003;"; b.onclick = () => { state.wip = state.wip.slice(0,-1); updateWipDisplay(); }; }
    else { b.textContent = k; b.onclick = () => wipDigit(k); }
    pad.appendChild(b);
  });
}

function wipDigit(d){
  if (state.wip.length >= 5) return;
  vibrate(15);
  state.wip += d;
  updateWipDisplay();
  if (state.wip.length === 5){
    checkForAdminNote(state.wip);
    setTimeout(() => goToStep(3), 180);
  }
}

async function checkForAdminNote(wip){
  const el = document.getElementById("adminNote");
  el.style.display = "none";
  el.innerHTML = "";
  if (!db) return; // Firebase not configured — silently skip, nothing else depends on this

  try {
    const doc = await db.collection("wipNotes").doc(wip).get();
    if (doc.exists && doc.data().message){
      el.innerHTML = '<span class="admin-note-label">Note from the office</span>' + escapeHtml(doc.data().message);
      el.style.display = "block";
    }
  } catch(err){
    console.error("Couldn't check for an admin note", err);
  }
}

function updateWipDisplay(){
  const el = document.getElementById("wipDisplay");
  if (!state.wip){
    el.innerHTML = '<span class="ph">-----</span>';
  } else {
    const padded = state.wip.padEnd(5, "\u00b7");
    el.textContent = padded;
  }
}

/* ============================================================
   STEP 3 — reg
   ============================================================ */
let regMode = "digits"; // "digits" | "letters"

function initRegInput(){
  renderRegKeyboard();
  updateRegDisplay();
}

function renderRegKeyboard(){
  document.getElementById("regModeBtn").textContent = regMode === "digits" ? "ABC" : "123";
  const grid = document.getElementById("regKbGrid");
  grid.innerHTML = "";
  const keys = regMode === "digits"
    ? ["1","2","3","4","5","6","7","8","9","0"]
    : "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  keys.forEach(k => {
    const b = document.createElement("button");
    b.className = "reg-key";
    b.textContent = k;
    b.onclick = () => regTypeChar(k);
    grid.appendChild(b);
  });
}

function toggleRegMode(){
  vibrate(15);
  regMode = regMode === "digits" ? "letters" : "digits";
  renderRegKeyboard();
}

function regTypeChar(ch){
  if (state.reg.length >= 12) return;
  vibrate(10);
  state.reg += ch;
  updateRegDisplay();
}

function regBackspace(){
  vibrate(10);
  state.reg = state.reg.slice(0, -1);
  updateRegDisplay();
}

function regClear(){
  vibrate(15);
  state.reg = "";
  updateRegDisplay();
}

function updateRegDisplay(){
  const el = document.getElementById("regDisplay");
  el.innerHTML = state.reg ? escapeHtml(state.reg) : '<span class="ph">Tap keys below</span>';

  document.getElementById("folderPreview").innerHTML = state.reg
    ? "Files will be saved to <code>" + escapeHtml(state.reg) + " / " + escapeHtml(state.wip) + "</code>"
    : "";
  document.getElementById("regContinueBtn").disabled = state.reg.length < 3;
}

function continueFromReg(){
  if (state.reg.length < 3) return;
  vibrate(30);
  goToStep(4);
  renderCaptures();
}

/* ============================================================
   STEP 4 — capture
   ============================================================ */
function triggerCapture(kind){
  vibrate(20);
  document.getElementById(kind === "photo" ? "photoInput" : "videoInput").click();
}

document.getElementById("photoInput").addEventListener("change", e => handleFile(e, "photo"));
document.getElementById("videoInput").addEventListener("change", e => handleFile(e, "video"));

function triggerGalleryPick(){
  vibrate(20);
  document.getElementById("galleryInput").click();
}

document.getElementById("galleryInput").addEventListener("change", handleGalleryFiles);

async function handleGalleryFiles(e){
  const files = Array.from(e.target.files || []);
  e.target.value = ""; // allow re-picking the same file(s) again later

  for (const file of files){
    const kind = file.type.indexOf("video/") === 0 ? "video" : "photo";
    // Imported files aren't fresh captures — skip the timestamp overlay
    // (it would be misleading to stamp today's date on an old screenshot)
    // and go straight to the label picker, one at a time, in order.
    try {
      openLabelPrompt(kind, file);
    } catch(err){
      console.error("Label prompt failed for an imported file, saving without a label", err);
      addCaptureWithoutPrompt(kind, file);
    }
  }
}

async function handleFile(e, kind){
  const file = e.target.files[0];
  e.target.value = ""; // allow re-selecting the same file next time
  if (!file) return;

  let blob = file;
  if (kind === "photo"){
    try { blob = await stampPhoto(file); } catch(err){ console.error("Stamp failed, using original", err); blob = file; }
  }

  try {
    openLabelPrompt(kind, blob);
  } catch(err){
    // Whatever just went wrong, the mechanic still took a real photo/video —
    // never lose it. Save it under a generic label rather than showing nothing.
    console.error("Label prompt failed, saving capture without a label", err);
    addCaptureWithoutPrompt(kind, blob);
  }
}

function extForBlob(kind, blob){
  let subtype = ((blob.type || "").split("/")[1] || "").split(";")[0]; // strip codec params
  if (kind === "photo") return subtype === "jpeg" ? "jpg" : (subtype || "jpg");
  if (subtype === "quicktime") return "mov";
  return subtype || "mp4";
}

function addCaptureWithoutPrompt(kind, blob){
  const label = sanitizeLabel(kind === "photo" ? "Photo" : "Video");
  const ext = extForBlob(kind, blob);
  const filename = buildFilename(label, ext);
  const seq = state.captures.length + 1;
  state.captures.push({
    id: "c" + Date.now() + "_" + seq,
    kind: kind,
    blob: blob,
    previewUrl: URL.createObjectURL(blob),
    filename: filename,
    label: label
  });
  renderCaptures();
}

/* ---- label picker (runs after every capture) ----
   Captures queue up rather than overwrite one another — if the mechanic
   fires off a second photo before labeling the first (e.g. tapped twice
   because the camera app was slow to open), both still get a turn instead
   of one silently disappearing. */
let captureQueue = []; // {kind, blob, previewUrl}

function openLabelPrompt(kind, blob){
  captureQueue.push({ kind: kind, blob: blob, previewUrl: URL.createObjectURL(blob) });
  if (captureQueue.length === 1){
    showLabelPromptFor(captureQueue[0]);
  }
  // If one is already showing, this one just waits its turn in the queue.
}

function showLabelPromptFor(item){
  const preview = document.getElementById("labelPreview");
  preview.innerHTML = item.kind === "photo"
    ? '<img src="' + item.previewUrl + '">'
    : '<video src="' + item.previewUrl + '" muted playsinline autoplay loop></video>';

  document.getElementById("labelOtherBox").style.display = "none";
  document.getElementById("labelOtherInput").value = "";
  renderLabelGrid();

  document.getElementById("labelOverlay").classList.add("show");
}

function advanceQueue(){
  captureQueue.shift();
  if (captureQueue.length){
    showLabelPromptFor(captureQueue[0]);
  } else {
    document.getElementById("labelOverlay").classList.remove("show");
  }
}

function renderLabelGrid(){
  const grid = document.getElementById("labelGrid");
  grid.innerHTML = "";
  CONFIG.labels.forEach(labelDef => {
    const existingCount = countCaptures(labelDef.name);
    const b = document.createElement("button");
    b.className = "btn label-btn";
    b.textContent = (labelDef.limit === 1 && existingCount > 0) ? "Retake " + labelDef.name : labelDef.name;
    b.onclick = () => chooseLabel(labelDef.name);
    grid.appendChild(b);
  });
  const otherBtn = document.createElement("button");
  otherBtn.className = "btn label-btn";
  otherBtn.textContent = "Other";
  otherBtn.onclick = () => {
    document.getElementById("labelOtherBox").style.display = "flex";
    document.getElementById("labelOtherInput").focus();
  };
  grid.appendChild(otherBtn);
}

function countCaptures(label){
  const key = label.trim().toLowerCase();
  return state.captures.filter(c => c.label && c.label.toLowerCase() === key).length;
}

function chooseLabel(label){
  vibrate(20);
  confirmLabel(label);
}

function confirmOtherLabel(){
  const typed = document.getElementById("labelOtherInput").value.trim();
  if (!typed) return;
  confirmLabel(typed);
}

function confirmLabel(rawLabel){
  const current = captureQueue[0];
  if (!current) return;

  let label = sanitizeLabel(rawLabel);

  const labelDef = CONFIG.labels.find(l => l.name.toLowerCase() === label.toLowerCase());
  if (labelDef && labelDef.limit === 1){
    // Only one of these allowed — capturing another replaces the existing one.
    state.captures = state.captures.filter(c => {
      if (c.label && c.label.toLowerCase() === label.toLowerCase()){
        URL.revokeObjectURL(c.previewUrl);
        return false;
      }
      return true;
    });
  }

  const ext = extForBlob(current.kind, current.blob);
  const filename = buildFilename(label, ext);
  const seq = state.captures.length + 1;

  state.captures.push({
    id: "c" + Date.now() + "_" + seq,
    kind: current.kind,
    blob: current.blob,
    previewUrl: current.previewUrl,
    filename: filename,
    label: label
  });

  renderCaptures();
  advanceQueue();
}

function discardPending(){
  const current = captureQueue[0];
  if (current) URL.revokeObjectURL(current.previewUrl);
  advanceQueue();
}

function sanitizeLabel(rawLabel){
  // Strip characters SharePoint doesn't allow in file names.
  const cleaned = String(rawLabel).trim().replace(/["#%*:<>?\/\\{|}~]/g, "").replace(/\s+/g, " ");
  return cleaned || "Other";
}

function buildFilename(label, ext){
  // Every file gets a random 4-digit code — including VIN/Mileage — so a
  // second visit to the same WIP (even a different day) never overwrites
  // what's already sitting in that SharePoint folder. "Retake VIN" still
  // replaces the shot within the current, unsent job (see confirmLabel),
  // this only guards against collisions once files actually reach SharePoint.
  const code = String(Math.floor(1000 + Math.random() * 9000));
  return state.reg + "_" + state.wip + " " + label + " " + code + "." + ext;
}

function drawTimestampBar(ctx, width, height){
  const barHeight = Math.max(48, Math.round(height * 0.045));
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, height - barHeight, width, barHeight);

  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const dateStr = pad(now.getDate()) + "/" + pad(now.getMonth()+1) + "/" + now.getFullYear() +
                  " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  const label = state.reg + "  \u2022  WIP " + state.wip + "  \u2022  " + dateStr;

  const fontSize = Math.max(20, Math.round(barHeight * 0.42));
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold " + fontSize + "px -apple-system, Roboto, Arial, sans-serif";
  ctx.textBaseline = "middle";
  ctx.fillText(label, 16, height - barHeight / 2, width - 32);
}

function stampPhoto(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      drawTimestampBar(ctx, img.width, img.height);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error("toBlob failed")), "image/jpeg", 0.9);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function removeCapture(id){
  const c = state.captures.find(c => c.id === id);
  if (c) URL.revokeObjectURL(c.previewUrl);
  state.captures = state.captures.filter(c => c.id !== id);
  renderCaptures();
}

function renderCaptures(){
  const wrap = document.getElementById("thumbs");
  wrap.innerHTML = "";
  document.getElementById("captureEmptyHint").style.display = state.captures.length ? "none" : "block";

  state.captures.forEach(c => {
    const div = document.createElement("div");
    div.className = "thumb" + (c.kind === "video" ? " video" : "");

    if (c.kind === "photo"){
      div.innerHTML = '<img src="' + c.previewUrl + '">';
    } else {
      div.innerHTML = '<video src="' + c.previewUrl + '" muted playsinline></video>';
    }

    const kindTag = document.createElement("div");
    kindTag.className = "kind";
    kindTag.textContent = c.label || (c.kind === "photo" ? "PHOTO" : "VIDEO");
    div.appendChild(kindTag);

    if (state.step === 4){
      const rm = document.createElement("button");
      rm.className = "rm";
      rm.innerHTML = "&times;";
      rm.onclick = () => removeCapture(c.id);
      div.appendChild(rm);
    }

    wrap.appendChild(div);
  });

  document.getElementById("submitBtn").disabled = state.captures.length === 0;
}

/* ============================================================
   SUBMIT — hand the files to the native share sheet (Mail)
   ============================================================ */
function newJobId(){
  return "job_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
}

async function startSubmit(){
  if (!state.captures.length) return;

  if (!navigator.share){
    alert("Sharing isn't supported in this browser. Open this page in Safari on iPhone or Chrome on Android.");
    return;
  }

  state.jobId = newJobId();

  const files = state.captures.map(c => new File(
    [c.blob],
    c.filename,
    { type: c.blob.type || (c.kind === "photo" ? "image/jpeg" : "video/mp4") }
  ));

  if (navigator.canShare && !navigator.canShare({ files: files })){
    alert("Your phone can't share this many files or this much data at once. Try sending fewer files, or trim any long videos, then send the rest separately.");
    return;
  }

  const recipientsConfigured = CONFIG.warrantyEmails.length && CONFIG.warrantyEmails[0].indexOf("EDIT ME") !== 0;
  const recipientText = recipientsConfigured ? CONFIG.warrantyEmails.join("; ") : "the warranty addresses";

  const subject = "[WarrantyApp] " + state.reg + " " + state.wip;
  const body = "Mechanic: " + state.mechanic + "\nReg: " + state.reg + "\nWIP: " + state.wip +
    "\n\nSend this to " + recipientText + " (add them all to To/Cc) to file these photos.";

  try {
    await navigator.share({ files: files, title: subject, text: body });
    document.getElementById("doneTitle").textContent = "Almost done";
    document.getElementById("doneSub").textContent =
      "Check the message that just opened — make sure it's addressed to " + recipientText +
      " and tap Send to finish submitting " + state.reg + " / " + state.wip + ".";
    goToStep(6);
  } catch(err){
    // User cancelled the share sheet, or the OS couldn't hand off the files — stay on
    // step 4 so they can just try Send again rather than losing their captures.
    console.log("Share cancelled or failed", err);
  }
}

/* ============================================================
   RESET / NEW JOB
   ============================================================ */
function resetForNewJob(keepMechanic){
  state.captures.forEach(c => URL.revokeObjectURL(c.previewUrl));
  captureQueue.forEach(c => URL.revokeObjectURL(c.previewUrl));
  captureQueue = [];
  document.getElementById("labelOverlay").classList.remove("show");
  document.getElementById("adminNote").style.display = "none";
  document.getElementById("adminNote").innerHTML = "";
  state = {
    step: 1,
    mechanic: keepMechanic ? state.mechanic : null,
    wip: "",
    reg: "",
    jobId: null,
    captures: []
  };
  updateWipDisplay();
  regMode = "digits";
  renderRegKeyboard();
  updateRegDisplay();
  goToStep(keepMechanic ? 2 : 1);
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  renderMechanics();
  renderWipKeypad();
  updateWipDisplay();
  initRegInput();
  renderCaptures();
  goToStep(1);
}

init();
</script>
